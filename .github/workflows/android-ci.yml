name: Android CI

on:
  push:
    branches:
      - main
      - sync-flowseal-2026-09
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Check Rust core
        run: cargo check

      - name: Build native libraries
        run: |
          mkdir -p app/src/main/jniLibs
          cargo ndk -t arm64-v8a --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release
          find app/src/main/jniLibs -type f -name '*.so' -print -exec ls -lh {} \;

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*-debug.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tg-ws-proxy-android-debug
          path: artifacts/*.apk
          if-no-files-found: error
